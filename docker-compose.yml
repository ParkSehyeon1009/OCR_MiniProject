services:
  db:
    image: postgres:16-alpine
    container_name: ocr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdfbrief}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pdfbrief}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-api
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pdfbrief}
      TZ: Asia/Seoul
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # OCR 비교 화면(/api/ocr-compare) 전용 서비스. Tesseract/EasyOCR(+PyTorch)처럼
  # 무거운 의존성을 메인 api 프로세스와 분리하기 위해 별도 컨테이너로 띄운다.
  # 이미지는 api와 동일한 Dockerfile을 공유하고, 실행 앱(app.ocr_compare_main)과
  # 포트만 다르다. DB를 쓰지 않으므로 depends_on/DATABASE_URL 오버라이드가 없다.
  ocr-compare:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-compare-api
    env_file:
      - ./backend/.env.example
    environment:
      TZ: Asia/Seoul
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.ocr_compare_main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
    container_name: ocr-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
